[workspace]
members = [
  "apps/genesis",
  "crates/genesis-cli",
  "crates/genesis-config",
  "crates/genesis-core",
  "crates/genesis-gateway",
  "crates/genesis-mcp",
  "crates/genesis-provider",
  "crates/genesis-storage",
  "crates/genesis-tools",
  "crates/genesis-types",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-stream = "0.3.6"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4.40", features = ["clock"] }
clap = { version = "4.5.32", features = ["derive"] }
dirs = "6.0.0"
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
glob = "0.3"
rand = "0.9"
regex = "1"
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustyline = "15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tempfile = "3.19.1"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
