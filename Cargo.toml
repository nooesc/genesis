[workspace]
members = [
  "apps/genesis",
  "crates/genesis-cli",
  "crates/genesis-config",
  "crates/genesis-core",
  "crates/genesis-gateway",
  "crates/genesis-lua",
  "crates/genesis-mcp",
  "crates/genesis-provider",
  "crates/genesis-storage",
  "crates/genesis-tools",
  "crates/genesis-types",
  "crates/genesis-auth",
  "crates/genesis-ui",
  "crates/genesis-tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4.40", features = ["clock"] }
clap = { version = "4.5.32", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
fd-lock = "4"
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
glob = "0.3"
open = "5"
rand = "0.9"
regex = "1"
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustyline = "15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tempfile = "3.19.1"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tracing-test = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
crossterm = "0.28"
owo-colors = "4"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
termimad = "0.30"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
which = "6"
ratatui = { version = "0.29", features = ["unstable-backend-writer"] }
insta = { version = "1", features = ["yaml"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
mlua = { version = "0.11.6", features = ["luau", "async", "send", "serialize", "vendored"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
opt-level = "s"
panic = "abort"
