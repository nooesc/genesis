name: Rust CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Rust checks
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 30
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      test: ${{ steps.test.outcome }}
      total_loc: ${{ steps.stats.outputs.total_loc }}
      test_loc: ${{ steps.stats.outputs.test_loc }}
      test_cases: ${{ steps.stats.outputs.test_cases }}
      crate_count: ${{ steps.stats.outputs.crate_count }}
      dep_count: ${{ steps.stats.outputs.dep_count }}
      unsafe_count: ${{ steps.stats.outputs.unsafe_count }}
      todo_count: ${{ steps.stats.outputs.todo_count }}
      pr_diff: ${{ steps.stats.outputs.pr_diff }}
      test_passed: ${{ steps.stats.outputs.test_passed }}
      test_failed: ${{ steps.stats.outputs.test_failed }}
      test_skipped: ${{ steps.stats.outputs.test_skipped }}
      overall: ${{ steps.result.outputs.overall }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install protoc
        run: |
          if command -v protoc &>/dev/null; then
            protoc --version
            exit 0
          fi
          PB_VER="28.3"
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) PB_ARCH="linux-aarch_64" ;;
            x86_64)        PB_ARCH="linux-x86_64" ;;
            *)             echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl -sSfL "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VER}/protoc-${PB_VER}-${PB_ARCH}.zip" -o /tmp/protoc.zip
          mkdir -p "$HOME/.local"
          unzip -qo /tmp/protoc.zip -d "$HOME/.local"
          rm /tmp/protoc.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      - name: Sweep stamp
        run: cargo sweep --stamp
        continue-on-error: true

      - name: cargo fmt
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: cargo nextest
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked 2>&1 | tee nextest-output.txt

      - name: Gather repository stats
        id: stats
        continue-on-error: true
        run: |
          set -euo pipefail
          is_test_name_file() {
            local file="$1"
            if [[ "$file" == *"/tests/"* || "$file" == *_test.rs || "$file" == *_tests.rs || "$file" == *"/tests.rs" ]]; then
              return 0
            fi
            return 1
          }

          test_loc_chunk() {
            local file="$1"
            if is_test_name_file "$file"; then
              wc -l < "$file"
            elif rg -q --no-heading "^[[:space:]]*#\\[cfg\\(test\\)\\]" "$file"; then
              awk '/^[[:space:]]*#\\[cfg\\(test\\)\\]/{in_test=1; next} in_test { print }' "$file" | wc -l
            else
              echo 0
            fi
          }

          rs_files=$(mktemp)
          find . \
            -type f \
            -name "*.rs" \
            -not -path '*/target/*' \
            -not -path '*/.git/*' \
            -not -path '*/.worktrees/*' \
            -not -path './.claude/*' \
            -print0 > "$rs_files"

          total_loc=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            total_loc=$((total_loc + lines))
          done < "$rs_files"

          test_loc=0
          while IFS= read -r -d '' file; do
            lines=$(test_loc_chunk "$file")
            test_loc=$((test_loc + lines))
          done < "$rs_files"

          if command -v rg >/dev/null 2>&1; then
          test_cases=$(rg -n --no-heading "^[[:space:]]*#\\[(tokio::test|test|async_test|rstest|test_case)\\]" -g '*.rs' apps crates . | wc -l | tr -d ' ')
          else
            test_cases="n/a"
          fi

          if command -v jq >/dev/null 2>&1; then
            crate_count=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length' || echo "n/a")
          else
            crate_count="n/a"
          fi

          # Dependency count from Cargo.lock
          dep_count=$(grep -c '^\[\[package\]\]' Cargo.lock 2>/dev/null || echo "n/a")

          # Unsafe block count
          if command -v rg >/dev/null 2>&1; then
            unsafe_count=$(rg -c 'unsafe ' -g '*.rs' --no-filename apps crates 2>/dev/null | awk '{s+=$1} END {print s+0}')
          else
            unsafe_count="n/a"
          fi

          # TODO/FIXME count
          if command -v rg >/dev/null 2>&1; then
            todo_count=$(rg -c 'TODO|FIXME' -g '*.rs' --no-filename apps crates 2>/dev/null | awk '{s+=$1} END {print s+0}')
          else
            todo_count="n/a"
          fi

          # PR diff stats (only for pull requests)
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null || true
            pr_diff=$(git diff --shortstat "origin/$GITHUB_BASE_REF"...HEAD 2>/dev/null | tr -s ' ' | sed 's/^ //' || echo "n/a")
          else
            pr_diff="n/a"
          fi

          # Parse nextest results from output
          test_passed=0
          test_failed=0
          test_skipped=0
          if [[ -f nextest-output.txt ]]; then
            summary=$(grep -oE '[0-9]+ tests? run: [0-9]+ passed' nextest-output.txt | tail -1 || true)
            if [[ -n "$summary" ]]; then
              test_passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
            fi
            failed=$(grep -oE '[0-9]+ failed' nextest-output.txt | tail -1 || true)
            if [[ -n "$failed" ]]; then
              test_failed=$(echo "$failed" | grep -oE '[0-9]+')
            fi
            skipped=$(grep -oE '[0-9]+ skipped' nextest-output.txt | tail -1 || true)
            if [[ -n "$skipped" ]]; then
              test_skipped=$(echo "$skipped" | grep -oE '[0-9]+')
            fi
          fi

          echo "total_loc=${total_loc}" >> "$GITHUB_OUTPUT"
          echo "test_loc=${test_loc}" >> "$GITHUB_OUTPUT"
          echo "test_cases=${test_cases}" >> "$GITHUB_OUTPUT"
          echo "crate_count=${crate_count}" >> "$GITHUB_OUTPUT"
          echo "dep_count=${dep_count}" >> "$GITHUB_OUTPUT"
          echo "unsafe_count=${unsafe_count}" >> "$GITHUB_OUTPUT"
          echo "todo_count=${todo_count}" >> "$GITHUB_OUTPUT"
          echo "pr_diff=${pr_diff}" >> "$GITHUB_OUTPUT"
          echo "test_passed=${test_passed}" >> "$GITHUB_OUTPUT"
          echo "test_failed=${test_failed}" >> "$GITHUB_OUTPUT"
          echo "test_skipped=${test_skipped}" >> "$GITHUB_OUTPUT"
          rm -f "$rs_files" nextest-output.txt

      - name: Mark overall result
        id: result
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "success" && "${{ steps.clippy.outcome }}" == "success" && "${{ steps.test.outcome }}" == "success" ]]; then
            echo "overall=passed" >> "$GITHUB_OUTPUT"
          else
            echo "overall=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  comment:
    name: Post PR summary
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post CI results comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- rust-ci-summary -->';
            const fmt = '${{ needs.checks.outputs.fmt }}';
            const clippy = '${{ needs.checks.outputs.clippy }}';
            const test = '${{ needs.checks.outputs.test }}';
            const overall = '${{ needs.checks.outputs.overall }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⚪' : '❌';
            const overallIcon = overall === 'passed' ? '✅' : '❌';
            const body = [
              marker,
              `## ${overallIcon} Rust CI — **${(overall || 'unknown').toUpperCase()}**`,
              '',
              '| Check | Status |',
              '| --- | --- |',
              `| \`cargo fmt\` | ${icon(fmt)} |`,
              `| \`cargo clippy\` | ${icon(clippy)} |`,
              `| \`cargo nextest\` | ${icon(test)} |`,
              '',
              `[Workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const me = (await github.rest.users.getAuthenticated()).data.login;
            const existing = comments.find((c) => c.user?.login === me && c.body?.includes(marker));
            const args = { owner, repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...args, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...args, issue_number: prNumber });
            }

      - name: Post codebase stats comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- rust-codebase-stats -->';
            const totalLocRaw = '${{ needs.checks.outputs.total_loc }}';
            const testLocRaw = '${{ needs.checks.outputs.test_loc }}';
            const hasStat = (v) => v !== '' && v !== 'n/a';
            const totalLoc = hasStat(totalLocRaw) ? Number(totalLocRaw) : null;
            const testLoc = hasStat(testLocRaw) ? Number(testLocRaw) : null;
            const testCases = '${{ needs.checks.outputs.test_cases }}' || 'n/a';
            const crateCount = '${{ needs.checks.outputs.crate_count }}' || 'n/a';
            const depCount = '${{ needs.checks.outputs.dep_count }}' || 'n/a';
            const unsafeCount = '${{ needs.checks.outputs.unsafe_count }}' || 'n/a';
            const todoCount = '${{ needs.checks.outputs.todo_count }}' || 'n/a';
            const prDiff = '${{ needs.checks.outputs.pr_diff }}' || 'n/a';
            const testPassedRaw = '${{ needs.checks.outputs.test_passed }}';
            const testFailedRaw = '${{ needs.checks.outputs.test_failed }}';
            const testSkippedRaw = '${{ needs.checks.outputs.test_skipped }}';
            const testPassed = hasStat(testPassedRaw) ? Number(testPassedRaw) : 0;
            const testFailed = hasStat(testFailedRaw) ? Number(testFailedRaw) : 0;
            const testSkipped = hasStat(testSkippedRaw) ? Number(testSkippedRaw) : 0;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const hasLoc = totalLoc !== null && testLoc !== null;
            const prodLoc = hasLoc ? totalLoc - testLoc : null;
            const testPct = hasLoc && totalLoc > 0 ? ((testLoc / totalLoc) * 100).toFixed(1) : null;
            const n = (v) => Number(v).toLocaleString('en-US');
            const testTotal = testPassed + testFailed + testSkipped;
            const testResult = testTotal > 0
              ? `**${n(testPassed)}** passed` + (testFailed > 0 ? `, **${n(testFailed)}** failed` : '') + (testSkipped > 0 ? `, **${n(testSkipped)}** skipped` : '')
              : 'n/a';

            const lines = [
              marker,
              '## Codebase Snapshot',
              '',
              '### Lines of Code',
            ];
            if (hasLoc) {
              const prodPct = totalLoc > 0 ? ((prodLoc / totalLoc) * 100).toFixed(1) : '0.0';
              lines.push(
                `| | Lines | % |`,
                `| --- | ---: | ---: |`,
                `| Production | **${n(prodLoc)}** | ${prodPct}% |`,
                `| Tests | **${n(testLoc)}** | ${testPct}% |`,
                `| **Total** | **${n(totalLoc)}** | |`,
              );
            } else {
              lines.push('Stats collection failed — no LOC data available.');
            }
            lines.push(
              '',
              '### Test Results',
              `| | |`,
              `| --- | ---: |`,
              `| Results | ${testResult} |`,
              `| Test cases (attrs) | **${testCases}** |`,
              '',
              '### Project',
              `| | |`,
              `| --- | ---: |`,
              `| Workspace crates | **${crateCount}** |`,
              `| Dependencies | **${depCount}** |`,
              `| \`unsafe\` usage | **${unsafeCount}** |`,
              `| \`TODO\`/\`FIXME\` | **${todoCount}** |`,
            ];

            if (prDiff && prDiff !== 'n/a') {
              lines.push('', '### This PR', `\`${prDiff}\``);
            }

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const me = (await github.rest.users.getAuthenticated()).data.login;
            const existing = comments.find((c) => c.user?.login === me && c.body?.includes(marker));
            const args = { owner, repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...args, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...args, issue_number: prNumber });
            }
