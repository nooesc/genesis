name: Rust CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Rust checks
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 30
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      test: ${{ steps.test.outcome }}
      total_loc: ${{ steps.stats.outputs.total_loc }}
      test_loc: ${{ steps.stats.outputs.test_loc }}
      test_cases: ${{ steps.stats.outputs.test_cases }}
      crate_count: ${{ steps.stats.outputs.crate_count }}
      overall: ${{ steps.result.outputs.overall }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Sweep stamp
        run: cargo sweep --stamp
        continue-on-error: true

      - name: cargo fmt
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: cargo nextest
        id: test
        continue-on-error: true
        run: cargo nextest run --workspace --locked

      - name: Gather repository stats
        id: stats
        continue-on-error: true
        run: |
          set -euo pipefail
          is_test_name_file() {
            local file="$1"
            if [[ "$file" == *"/tests/"* || "$file" == *_test.rs || "$file" == *_tests.rs || "$file" == *"/tests.rs" ]]; then
              return 0
            fi
            return 1
          }

          test_loc_chunk() {
            local file="$1"
            if is_test_name_file "$file"; then
              wc -l < "$file"
            elif rg -q --no-heading "^[[:space:]]*#\\[cfg\\(test\\)\\]" "$file"; then
              awk '/^[[:space:]]*#\\[cfg\\(test\\)\\]/{in_test=1; next} in_test { print }' "$file" | wc -l
            else
              echo 0
            fi
          }

          rs_files=$(mktemp)
          find . \
            -type f \
            -name "*.rs" \
            -not -path '*/target/*' \
            -not -path '*/.git/*' \
            -not -path '*/.worktrees/*' \
            -not -path './.claude/*' \
            -print0 > "$rs_files"

          total_loc=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            total_loc=$((total_loc + lines))
          done < "$rs_files"

          test_loc=0
          while IFS= read -r -d '' file; do
            lines=$(test_loc_chunk "$file")
            test_loc=$((test_loc + lines))
          done < "$rs_files"

          if command -v rg >/dev/null 2>&1; then
          test_cases=$(rg -n --no-heading "^[[:space:]]*#\\[(tokio::test|test|async_test|rstest|test_case)\\]" -g '*.rs' apps crates . | wc -l | tr -d ' ')
          else
            test_cases="n/a"
          fi

          if command -v jq >/dev/null 2>&1; then
            crate_count=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length' || echo "n/a")
          else
            crate_count="n/a"
          fi

          echo "total_loc=${total_loc}" >> "$GITHUB_OUTPUT"
          echo "test_loc=${test_loc}" >> "$GITHUB_OUTPUT"
          echo "test_cases=${test_cases}" >> "$GITHUB_OUTPUT"
          echo "crate_count=${crate_count}" >> "$GITHUB_OUTPUT"
          rm -f "$rs_files"

      - name: Mark overall result
        id: result
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "success" && "${{ steps.clippy.outcome }}" == "success" && "${{ steps.test.outcome }}" == "success" ]]; then
            echo "overall=passed" >> "$GITHUB_OUTPUT"
          else
            echo "overall=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  comment:
    name: Post PR summary
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Create or update PR summary comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- rust-ci-summary -->';
            const fmt = '${{ needs.checks.outputs.fmt }}';
            const clippy = '${{ needs.checks.outputs.clippy }}';
            const test = '${{ needs.checks.outputs.test }}';
            const totalLoc = '${{ needs.checks.outputs.total_loc }}';
            const testLoc = '${{ needs.checks.outputs.test_loc }}';
            const testCases = '${{ needs.checks.outputs.test_cases }}';
            const crateCount = '${{ needs.checks.outputs.crate_count }}';
            const overall = '${{ needs.checks.outputs.overall }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const formatStatus = (status) => {
              if (status === 'success') {
                return '✅';
              }
              if (status === 'skipped') {
                return '⚪';
              }
              return '❌';
            };
            const overallIcon = overall === 'passed' ? '✅' : '❌';
            const tableRows = [
              '| Check | Status |',
              '| --- | --- |',
              `| cargo fmt --all -- --check | ${formatStatus(fmt)} |`,
              `| cargo clippy --workspace -- -D warnings | ${formatStatus(clippy)} |`,
              `| cargo nextest run --workspace --locked | ${formatStatus(test)} |`,
            ];
            const statsRows = [
              '| Metric | Value |',
              '| --- | --- |',
              `| Total Rust LOC | ${totalLoc || 'n/a'} |`,
              `| Estimated test LOC | ${testLoc || 'n/a'} |`,
              `| Estimated test cases | ${testCases || 'n/a'} |`,
              `| Workspace crate count | ${crateCount || 'n/a'} |`,
            ];
            const body = `${marker}\n## Rust CI Summary\n\nResult: ${overallIcon} **${overall.toUpperCase()}**\n\n${tableRows.join('\n')}\n\n### Codebase Snapshot\n${statsRows.join('\n')}\n\nWorkflow run: [${context.workflow} #${context.runNumber}](${runUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const authUser = (await github.rest.users.getAuthenticated()).data.login;
            const existing = comments.find((comment) =>
              comment.user?.login === authUser && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
